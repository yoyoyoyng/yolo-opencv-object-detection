<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">YOLO normalized bounding-box label format</title>
  <desc id="desc">An image contains a bounding box represented by class id, normalized x center, y center, width, and height.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#59636e"/>
    </marker>
  </defs>
  <rect width="1100" height="500" rx="24" fill="#f7f9fb"/>
  <text x="550" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1f2328">YOLO Detection Label: class x_center y_center width height</text>
  <g transform="translate(70 90)">
    <rect width="600" height="340" fill="#e8edf2" stroke="#59636e" stroke-width="3"/>
    <text x="18" y="30" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#59636e">image width = W, image height = H</text>
    <rect x="210" y="95" width="245" height="170" fill="none" stroke="#2f6feb" stroke-width="5"/>
    <circle cx="332.5" cy="180" r="7" fill="#cf222e"/>
    <line x1="332.5" y1="180" x2="332.5" y2="310" stroke="#cf222e" stroke-width="3" stroke-dasharray="8 7"/>
    <line x1="332.5" y1="180" x2="65" y2="180" stroke="#cf222e" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="345" y="174" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#cf222e">(x_center, y_center)</text>
    <line x1="210" y1="285" x2="455" y2="285" stroke="#2f6feb" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="332" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2f6feb">box width</text>
    <line x1="475" y1="95" x2="475" y2="265" stroke="#2f6feb" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="520" y="185" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2f6feb">box height</text>
  </g>
  <g transform="translate(720 120)" font-family="Arial, Helvetica, sans-serif">
    <rect width="315" height="250" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <text x="24" y="48" font-size="22" font-weight="700" fill="#1f2328">Example label</text>
    <rect x="22" y="72" width="272" height="48" rx="8" fill="#1f2328"/>
    <text x="158" y="104" text-anchor="middle" font-family="monospace" font-size="18" fill="#ffffff">0 0.55 0.53 0.41 0.50</text>
    <text x="24" y="152" font-size="17" fill="#59636e">0 = class ID (chanyong)</text>
    <text x="24" y="184" font-size="17" fill="#59636e">Coordinates are divided by W and H.</text>
    <text x="24" y="216" font-size="17" fill="#59636e">Every value stays between 0 and 1.</text>
  </g>
</svg>
