<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">YOLO and OpenCV real-time detection pipeline</title>
  <desc id="desc">USB webcam frames are read by OpenCV, resized and passed to YOLO, then detections are filtered and drawn back onto the video.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#59636e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="260" rx="24" fill="#f7f9fb"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(35 65)">
      <rect width="190" height="125" rx="18" fill="#ffffff" stroke="#2f6feb" stroke-width="3"/>
      <text x="95" y="43" font-size="22" font-weight="700" fill="#1f2328">USB Webcam</text>
      <text x="95" y="76" font-size="16" fill="#59636e">/dev/video0</text>
      <text x="95" y="101" font-size="15" fill="#59636e">RGB scene input</text>
    </g>
    <g transform="translate(275 65)">
      <rect width="190" height="125" rx="18" fill="#ffffff" stroke="#1f883d" stroke-width="3"/>
      <text x="95" y="43" font-size="22" font-weight="700" fill="#1f2328">OpenCV</text>
      <text x="95" y="76" font-size="16" fill="#59636e">VideoCapture</text>
      <text x="95" y="101" font-size="15" fill="#59636e">Frame handling</text>
    </g>
    <g transform="translate(515 65)">
      <rect width="190" height="125" rx="18" fill="#ffffff" stroke="#bf8700" stroke-width="3"/>
      <text x="95" y="43" font-size="22" font-weight="700" fill="#1f2328">YOLO26n</text>
      <text x="95" y="76" font-size="16" fill="#59636e">Single-pass inference</text>
      <text x="95" y="101" font-size="15" fill="#59636e">Box + class + score</text>
    </g>
    <g transform="translate(755 65)">
      <rect width="190" height="125" rx="18" fill="#ffffff" stroke="#8250df" stroke-width="3"/>
      <text x="95" y="43" font-size="22" font-weight="700" fill="#1f2328">Post-process</text>
      <text x="95" y="76" font-size="16" fill="#59636e">Confidence threshold</text>
      <text x="95" y="101" font-size="15" fill="#59636e">Coordinate conversion</text>
    </g>
    <g transform="translate(995 65)">
      <rect width="170" height="125" rx="18" fill="#ffffff" stroke="#cf222e" stroke-width="3"/>
      <text x="85" y="43" font-size="22" font-weight="700" fill="#1f2328">Overlay</text>
      <text x="85" y="76" font-size="16" fill="#59636e">Rectangle + label</text>
      <text x="85" y="101" font-size="15" fill="#59636e">Real-time display</text>
    </g>
  </g>
  <g stroke="#59636e" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <line x1="228" y1="127" x2="267" y2="127"/>
    <line x1="468" y1="127" x2="507" y2="127"/>
    <line x1="708" y1="127" x2="747" y2="127"/>
    <line x1="948" y1="127" x2="987" y2="127"/>
  </g>
  <text x="600" y="230" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" fill="#59636e">OpenCV manages the video stream; YOLO performs object detection; OpenCV renders the final result.</text>
</svg>
